# Bundle layer for dsh-rev-eng.
#
# Mounts this package's own plugin, which registers a skill provider over the
# packaged skills/ directory (import.meta.url-relative, so it resolves wherever
# the package is installed — the profile composition's baseUrl points at the
# profile directory, not at this package, which is why the skills ride behind
# plugin code instead of a skill-filesystem customSkillDirs row).
#
# Optional: patches/rea-mcp.yml is a separate overlay that mounts the REA MCP
# server; it is never part of this bundle layer.
- insert:
    - id: rev-eng-skills
      name: dsh-rev-eng
