# dsh overlay: mount the REA MCP server as one dsh MCP client row.
#
# CHOOSE ONE MOUNT. This overlay and `rea setup --client dsh` both register an
# MCP client row with serverName `rea`. dsh refuses two entries with that same
# serverName even when they sit in different layers (home patch, profile patch,
# or a --patch overlay): the result is a duplicate-server-name load failure.
# Never enable both. Use one, not both.
#
# - Official registration: `npx -y rea-agents@6.8.0 setup --client dsh` writes
#   its own root-level insert with id `rea-mcp` into $DSH_HOME/cordis.patch.yml
#   (the home patch, every profile, desktop app included). The generated row
#   carries `serverName`, `transport`, `command` and `args` only: no
#   `toolCallTimeoutMs` and no `env`. Add those under the row's `config` and
#   REA keeps them when it later rewrites its own row. `rea doctor --client
#   dsh --json` and `rea uninstall` understand that row. Prefer setup when REA
#   may manage its own registration. Note that setup hard-gates the Node
#   version; this overlay needs no setup and no Node gate.
# - This overlay: for a pack-managed row that boots from `npx` without writing
#   the home patch, or for a profile-scoped experiment. It keeps the same id
#   `rea-mcp` so REA's tooling recognizes the row if this insert is merged into
#   the home patch.
#
# One-shot use, for a single run of a profile:
#
#   dsh --profile <name> --patch /absolute/path/to/patches/rea-mcp.yml
#
# In a terminal this is also the quickest place to watch the connection:
# look for `mcp-client(rea)` lines in the process output.
#
# Permanent use: merge the `insert` row below into an existing patch layer and
# do not replace a file that may hold unrelated patches. Merge it into one of:
#
#   $DSH_HOME/profiles/<name>/cordis.patch.yml   # one profile
#   $DSH_HOME/cordis.patch.yml                   # every profile (what setup writes)
#
# Example permanent merge, with other user patches kept around it:
#
#   # $DSH_HOME/profiles/web/cordis.patch.yml
#   - insert:
#       - id: rea-mcp
#         name: '@deepseek-ai/dsh-mcp-client'
#         config:
#           serverName: rea
#           transport: stdio
#           command: npx
#           args: ['-y', 'rea-agents@6.8.0', 'mcp']
#           toolCallTimeoutMs: 600000
#   - insert:
#       - id: some-other-user-plugin
#         name: some-other-package
#
# Details of the row:
#
# - `id: rea-mcp` matches the id REA's own setup writes, so the row is
#   recognizable to REA tooling if it ever lands in a file `rea doctor` reads.
# - `serverName: rea` is the local namespace. The model calls the discovered
#   tools as `mcp__rea__<rawName>`, for example `mcp__rea__open_binary`.
# - `transport: stdio` starts `npx -y rea-agents@6.8.0 mcp` as a child of the
#   dsh plugin lifecycle. The client removes ambient credential-named and
#   `DSH_*` variables before launching the child; add any REA_* variable the
#   server must have to `config.env` instead of relying on the ambient shell.
# - `toolCallTimeoutMs` is milliseconds per tools/call. dsh's default is
#   60000, far too short for real analyses: REA's per-source static-analysis
#   budget defaults to 300000 ms and a cold Ghidra import can take 330000 ms.
#   600000 (10 minutes) leaves headroom; raise it for enormous applications or
#   lower it for short interactive inspections. The official row generated by
#   `rea setup --client dsh` omits this field by default; add it under that
#   row's `config`, and setup preserves caller-owned config fields across runs.
# - An initial connection failure does not abort the harness by default
#   (`failOnStartupError: false`): the session starts with no `mcp__rea__*`
#   tools and the failure is logged. Fix the cause, then restart the harness.
#
# The YAML is deliberately plain: one insert operation, flow-sequence args, no
# anchors and no custom tags, so it composes through dsh's profile loader.
- insert:
    - id: rea-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio
        command: npx
        args: ['-y', 'rea-agents@6.8.0', 'mcp']
        toolCallTimeoutMs: 600000
